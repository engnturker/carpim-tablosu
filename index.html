<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Çarpım Tablosu Alıştırma</title>
<style>
  :root {
    --bg: #f5f7fb; --card: #fff; --text: #1f2937; --muted: #6b7280;
    --accent: #2563eb; --ok: #16a34a; --bad: #dc2626; --border: #d1d5db;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--border);
    padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  h1 { font-size: 20px; margin: 0 8px 0 0; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--border); background: #fff; color: var(--text);
    border-radius: 8px; padding: 8px 14px; }
  button:hover { border-color: var(--accent); }
  #newBtn { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  .nums { display: flex; flex-wrap: wrap; gap: 6px; }
  .nums button { min-width: 42px; font-weight: 600; }
  .nums button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  #score { margin-left: auto; color: var(--muted); font-weight: 600; }
  #msg { padding: 40px 16px; text-align: center; color: var(--muted); font-size: 18px; }
  #grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; padding: 10px; }
  .q { display: flex; align-items: center; gap: 2px; background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 3px 6px; font-size: 16px; white-space: nowrap; }
  .q input { width: 44px; min-width: 0; font: inherit; padding: 2px 4px; border: 1px solid var(--border);
    border-radius: 6px; text-align: center; }
  .q input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  .mark { width: 18px; font-weight: 700; font-size: 18px; }
  .q.ok { border-color: var(--ok); } .q.ok .mark { color: var(--ok); }
  .q.bad { border-color: var(--bad); } .q.bad .mark { color: var(--bad); }
  @media (max-width: 1400px) { #grid { grid-template-columns: repeat(8, 1fr); } }
  @media (max-width: 1100px) { #grid { grid-template-columns: repeat(6, 1fr); } }
  @media (max-width: 800px) { #grid { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 560px) { #grid { grid-template-columns: repeat(3, 1fr); } #score { margin-left: 0; } }
  button { touch-action: manipulation; }
  .q input { font-size: 16px; }
  @media (pointer: coarse) {
    .nums button, header > button { min-height: 44px; }
    .nums button { min-width: 44px; flex: 1 0 44px; }
    .q input { width: 50px; padding: 6px 4px; }
  }
  @media (max-width: 560px) {
    header { gap: 8px; padding: 8px 10px; position: static; }
    h1 { width: 100%; font-size: 18px; margin: 0; }
    .nums { width: 100%; order: 3; }
    #score { width: 100%; order: 4; font-size: 14px; }
  }
  @media (max-height: 500px) {
    header { position: static; padding: 6px 10px; gap: 8px; }
    h1 { font-size: 16px; }
    .nums { flex: 1 1 auto; flex-wrap: nowrap; overflow-x: auto; }
    #score { margin-left: 0; font-size: 14px; }
  }
</style>
</head>
<body>
<header>
  <h1>Çarpım Tablosu</h1>
  <button id="newBtn">Yeni Çalışma</button>
  <div class="nums" id="nums"></div>
  <button id="allBtn">Hepsi</button>
  <div id="score"></div>
</header>
<div id="msg"></div>
<main id="grid"></main>

<script>
const COUNT = 200;
const selected = new Set();
const numsEl = document.getElementById('nums');
const gridEl = document.getElementById('grid');
const msgEl = document.getElementById('msg');
const scoreEl = document.getElementById('score');

for (let n = 1; n <= 10; n++) {
  const b = document.createElement('button');
  b.textContent = n;
  b.onclick = () => { selected.has(n) ? selected.delete(n) : selected.add(n); b.classList.toggle('on'); build(); };
  numsEl.appendChild(b);
}
document.getElementById('allBtn').onclick = () => {
  for (let n = 1; n <= 10; n++) selected.add(n);
  [...numsEl.children].forEach(b => b.classList.add('on'));
  build();
};
document.getElementById('newBtn').onclick = build;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function makeQuestions() {
  const pool = [];
  for (const a of selected) for (let b = 1; b <= 10; b++) pool.push([a, b]);
  const out = [];
  while (out.length < COUNT) {
    const round = shuffle(pool.slice());
    // aynı soru art arda gelmesin
    if (out.length && pool.length > 1 && round[0][0] === out.at(-1)[0] && round[0][1] === out.at(-1)[1]) round.push(round.shift());
    out.push(...round);
  }
  return out.slice(0, COUNT).map(([a, b]) => Math.random() < 0.5 ? [a, b] : [b, a]);
}

function updateScore() {
  const ok = gridEl.querySelectorAll('.q.ok').length;
  const bad = gridEl.querySelectorAll('.q.bad').length;
  scoreEl.textContent = gridEl.children.length ? `Doğru: ${ok}  |  Yanlış: ${bad}  |  Toplam: ${gridEl.children.length}` : '';
}

function build() {
  gridEl.innerHTML = '';
  if (!selected.size) { msgEl.textContent = 'Başlamak için yukarıdan bir veya daha fazla sayı seçin.'; msgEl.hidden = false; updateScore(); return; }
  msgEl.hidden = true;
  const frag = document.createDocumentFragment();
  const inputs = [];
  for (const [a, b] of makeQuestions()) {
    const ans = String(a * b);
    const cell = document.createElement('div');
    cell.className = 'q';
    cell.innerHTML = `<span>${a}×${b}=</span><input type="text" inputmode="numeric" autocomplete="off" maxlength="3"><span class="mark"></span>`;
    const inp = cell.querySelector('input'), mark = cell.querySelector('.mark');
    inputs.push(inp);
    inp.addEventListener('input', () => {
      inp.value = inp.value.replace(/\D/g, '');
      cell.classList.remove('ok', 'bad'); mark.textContent = '';
      if (inp.value === ans) {
        cell.classList.add('ok'); mark.textContent = '✓';
        const next = inputs[inputs.indexOf(inp) + 1]; if (next) next.focus();
      } else if (inp.value.length >= ans.length) {
        cell.classList.add('bad'); mark.textContent = '✗';
      }
      updateScore();
    });
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { const next = inputs[inputs.indexOf(inp) + 1]; if (next) next.focus(); }
    });
    frag.appendChild(cell);
  }
  gridEl.appendChild(frag);
  updateScore();
}

build();
</script>
</body>
</html>
